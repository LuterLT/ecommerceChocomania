spring:
  application:
    name: chocomania-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chocomania}
    username: ${POSTGRES_USER:chocomania}
    password: ${POSTGRES_PASSWORD:chocomania_local}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
